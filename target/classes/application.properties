# =====================================================================
#  ALMORA - Banco de alimentos
#  Ningun secreto va escrito aqui. Todos se leen de variables de entorno
#  o del archivo .env (copia .env.example como .env y llenalo).
# =====================================================================
spring.application.name=almora-api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
# No mostrar trazas internas en los errores (seguridad)
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------- MongoDB Atlas ----------------
# Spring Boot 4: la conexion va en spring.mongodb.* (antes spring.data.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:almora_db}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.representation.big-decimal=decimal128
# Spring crea los indices declarados con @Indexed / @CompoundIndex
spring.data.mongodb.auto-index-creation=true

# ---------------- JSON y fechas ----------------
# Jackson 3 (Spring Boot 4) ya escribe las fechas como texto ISO e ignora campos desconocidos
spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=non_null

# ---------------- Paginacion (RNF-ES01) ----------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---------------- JWT ----------------
# JWT_SECRET: minimo 32 bytes aleatorios en Base64 (ver guia, paso de seguridad)
almora.jwt.secreto=${JWT_SECRET}
almora.jwt.emisor=almora-api
almora.jwt.minutos-acceso=15
almora.jwt.dias-refresco=7
almora.jwt.cookie-segura=${COOKIE_SECURE:false}

# ---------------- Proteccion contra fuerza bruta ----------------
almora.seguridad.max-intentos=5
almora.seguridad.minutos-bloqueo=15

# ---------------- CORS ----------------
almora.cors.origenes-permitidos=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:5500}

# ---------------- FEFO y semaforo (SCAMPER A1, HU10) ----------------
# VERDE: mas de dias-amarillo | AMARILLO: entre dias-rojo+1 y dias-amarillo | ROJO: dias-rojo o menos
almora.fefo.dias-amarillo=15
almora.fefo.dias-rojo=5
almora.fefo.dias-alerta=5
almora.zona-horaria=America/Bogota

# ---------------- Superadministrador inicial ----------------
almora.superadmin.correo=${SUPERADMIN_EMAIL:}
almora.superadmin.password=${SUPERADMIN_PASSWORD:}
almora.superadmin.nombre=${SUPERADMIN_NAME:Super Administrador}

# Crea un catalogo de productos de ejemplo si la coleccion esta vacia
almora.datos-demo=${DATOS_DEMO:true}

# ---------------- Correo (HU06) ----------------
almora.mail.habilitado=${MAIL_ENABLED:false}
almora.mail.remitente=${MAIL_FROM:no-reply@almora.org}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------- Respaldos (RNF-BD01) ----------------
# Copia de seguridad automatica de todas las colecciones (JSON comprimido en .zip)
almora.respaldo.habilitado=${BACKUP_ENABLED:true}
almora.respaldo.carpeta=${BACKUP_DIR:respaldos}
# Todos los domingos a las 2:00 a. m. (segundo minuto hora dia mes dia-semana)
almora.respaldo.cron=${BACKUP_CRON:0 0 2 * * SUN}
almora.respaldo.conservar=${BACKUP_KEEP:8}

# ---------------- Rendimiento (RNF-R01, RNF-R02) ----------------
# Se registra una advertencia si una peticion tarda mas de este limite
almora.rendimiento.limite-ms=3000

# Marca los lotes vencidos todos los dias a las 12:05 a. m. (HU10)
almora.fefo.cron-vencimientos=0 5 0 * * *

# ---------------- Monitoreo (RNF-D01) ----------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------- Swagger UI ----------------
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
